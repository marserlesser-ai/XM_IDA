name: Run
on:
  workflow_dispatch:
    inputs:
      region:
        type: choice
        options:
          - Global
          - Japan
        required: true
      version:
        required: true
      enable_script:
        type: boolean
        default: true
        required: true
      gameassembly_url:
        type: string
        required: false

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: Download IDA installer parts
        shell: bash
        run: |
          curl.exe -L -O "https://pub-dc80a5a639cb4c709e11547ed7bfbf1e.r2.dev/IDA%20Pro/9.4/9.4.7z.001"
          curl.exe -L -O "https://pub-dc80a5a639cb4c709e11547ed7bfbf1e.r2.dev/IDA%20Pro/9.4/9.4.7z.002"
          curl.exe -L -O "https://pub-dc80a5a639cb4c709e11547ed7bfbf1e.r2.dev/IDA%20Pro/9.4/9.4.7z.003"

      - name: Extract installer
        shell: bash
        run: 7z x "9.4.7z.001" -o"ida_extracted"

      - name: Install IDA silently
        shell: pwsh
        working-directory: ida_extracted
        run: |
          Start-Process -FilePath ".\ida-pro_94_x64win.exe" -ArgumentList "--mode unattended --unattendedmodeui none --prefix C:/ida --install_python 0 --activate_idalib 1" -Verb RunAs -Wait

      - name: Copy license
        shell: bash
        run: cp ida_extracted/idapro.hexlic C:/ida/idapro.hexlic

      - name: Copy IDA DLLs
        shell: bash
        run: |
          cp ida_extracted/ida.dll C:/ida/ida.dll
          cp ida_extracted/ida32.dll C:/ida/ida32.dll

      - name: Run idapyswitch
        shell: bash
        run: echo 0 | C:/ida/idapyswitch.exe

      - name: Accept IDA EULA
        shell: bash
        run: |
          cat > accept_eula.py << 'EOF'
          #!/usr/bin/env python3
          from __future__ import annotations

          import os
          import sys
          from pathlib import Path


          EULA_KEYS = ("EULA 90", "EULA 91", "EULA 92", "EULA 93")


          def accept_ida_eula(ida_dir: str | Path) -> None:
              ida_dir = Path(ida_dir).expanduser().resolve()
              if not ida_dir.exists():
                  raise FileNotFoundError(f"IDA directory does not exist: {ida_dir}")

              idalib_python = ida_dir / "idalib" / "python"
              if not idalib_python.exists():
                  raise RuntimeError(
                      f"{idalib_python} not found. "
                      "This install likely does not include idalib."
                  )

              os.environ["IDADIR"] = str(ida_dir)
              sys.path.insert(0, str(idalib_python))

              try:
                  import idapro  # noqa: F401
                  import ida_registry
              except Exception as exc:
                  raise RuntimeError(
                      "Failed to load idalib. Make sure this is a full IDA Pro install "
                      "and that its runtime dependencies are available."
                  ) from exc

              for key in EULA_KEYS:
                  ida_registry.reg_write_int(key, 1)

              print(f"Accepted IDA EULA for: {ida_dir}")
              print("Written keys:", ", ".join(EULA_KEYS))


          def main() -> int:
              target = Path(sys.argv[1]) if len(sys.argv) > 1 else Path.cwd()
              accept_ida_eula(target)
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          EOF
          py accept_eula.py C:/ida

      - name: Download IL2CPP dump release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.region }}-PC-${{ inputs.version }}
        run: |
          ASSET_URL=$(curl -s "https://api.github.com/repos/marserlesser-ai/RDump/releases/tags/$RELEASE_TAG" \
            | grep "browser_download_url.*\.zip" | head -1 | cut -d '"' -f 4)

          echo "Downloading: $ASSET_URL"
          curl -L -o dump.zip "$ASSET_URL"
          mkdir -p il2cpp_dump
          unzip dump.zip -d il2cpp_dump
          ls -la il2cpp_dump

      - name: Download custom GameAssembly.dll
        if: ${{ inputs.gameassembly_url != '' }}
        shell: bash
        env:
          GAMEASSEMBLY_URL: ${{ inputs.gameassembly_url }}
        run: |
          echo "Downloading custom GameAssembly.dll from: $GAMEASSEMBLY_URL"
          curl -L -o il2cpp_dump/GameAssembly.dll "$GAMEASSEMBLY_URL"
          ls -la il2cpp_dump

      - name: Run IDA headless analysis
        shell: bash
        env:
          ENABLE_SCRIPT: ${{ inputs.enable_script }}
        run: |
          mkdir -p output

          if [ "$ENABLE_SCRIPT" = "true" ]; then
            echo "Running with IL2CPP script enabled"
            C:/ida/idat.exe -A -Lil2cpp_analysis.log \
              -o"D:/a/XM_IDA/XM_IDA/output/GameAssembly" \
              -S"D:/a/XM_IDA/XM_IDA/il2cpp_dump/il2cpp.py" \
              D:/a/XM_IDA/XM_IDA/il2cpp_dump/GameAssembly.dll
          else
            echo "Running without IL2CPP script"
            C:/ida/idat.exe -A -Lil2cpp_analysis.log \
              -o"D:/a/XM_IDA/XM_IDA/output/GameAssembly" \
              D:/a/XM_IDA/XM_IDA/il2cpp_dump/GameAssembly.dll
          fi

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ida-il2cpp-analysis
          path: |
            output/
            il2cpp_analysis.log
